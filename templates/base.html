<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Dashboard</title>
    <!-- Подключаем Tailwind CSS через CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Подключаем шрифт Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-gray-50 text-gray-900">
    <!-- Навигация -->
    <nav class="bg-indigo-600 text-white shadow-lg">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16 items-center">
                <div class="flex items-center space-x-4">
                    <a href="/" class="text-xl font-bold tracking-tight">🎓 StudentDash</a>
                    <a class="nav-link" href="/courses/" class="hover:bg-indigo-500 px-3 py-2 rounded-md text-sm font-medium">Мои курсы</a>
                    <a class="nav-link" href="/assignments/" class="hover:bg-indigo-500 px-3 py-2 rounded-md text-sm font-medium">Задания</a>
                    <a class="nav-link" href="{% url 'courses:schedule' %}">Расписание</a>
                    <a class="nav-link" href="{% url 'courses:teacher_list' %}">Преподаватели</a>
                    <a class="nav-link" href="{% url 'courses:recommend' %}">Подбор курса</a>
                    <a class="nav-link" href="/study/timer/" class="hover:bg-indigo-500 px-3 py-2 rounded-md text-sm font-medium">Таймер</a>
                </div>
                <div class="flex items-center space-x-4">
                    <a class="navbar-text me-3 text-white text-decoration-none" href="{% url 'courses:profile' %}">
                        Привет, {{ user.username|default:"Гость" }}!
                    </a>
                    {% if user.is_superuser %}
                        <a href="/admin/" class="text-sm bg-indigo-700 hover:bg-indigo-800 px-3 py-1.5 rounded-md transition">Админка</a>
                    {% endif %}
                </div>
            </div>
        </div>
    </nav>

    <!-- Основной контент -->
    <main class="max-w-7xl mx-auto py-8 px-4 sm:px-6 lg:px-8">
        {% block content %}
        <!-- Сюда дочерние шаблоны будут вставлять свой код -->
        {% endblock %}
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
