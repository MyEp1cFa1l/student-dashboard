{% extends "base.html" %}

{% block content %}
<div class="max-w-md mx-auto mt-10 bg-white rounded-xl shadow-sm border border-gray-200 p-8 text-center">
    <h1 class="text-2xl font-bold text-gray-900 mb-6">Таймер учебы</h1>
    
    <!-- Визуальный таймер -->
    <div class="text-6xl font-mono font-bold text-indigo-600 mb-8" id="display">25:00</div>
    
    <div class="flex justify-center space-x-4 mb-8">
        <button id="startBtn" class="bg-indigo-600 text-white px-6 py-2 rounded-lg hover:bg-indigo-700 transition">Старт</button>
        <button id="pauseBtn" class="bg-gray-200 text-gray-800 px-6 py-2 rounded-lg hover:bg-gray-300 transition">Пауза</button>
        <button id="resetBtn" class="bg-rose-100 text-rose-700 px-6 py-2 rounded-lg hover:bg-rose-200 transition">Сброс</button>
    </div>

    <hr class="my-6 border-gray-200">

    <!-- Форма сохранения -->
    <h2 class="text-lg font-medium text-gray-900 mb-4">Сохранить результат</h2>
    <form method="post" class="text-left space-y-4">
        {% csrf_token %}
        {% for field in form %}
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">{{ field.label }}</label>
                {{ field }}
            </div>
        {% endfor %}
        <button type="submit" class="w-full bg-emerald-500 text-white px-4 py-2 rounded-lg hover:bg-emerald-600 transition mt-4">
            Записать в дневник
        </button>
    </form>
</div>

<script>
    let timeLeft = 25 * 60; // 25 минут в секундах
    let timerId = null;
    const display = document.getElementById('display');
    
    function updateDisplay() {
        const minutes = Math.floor(timeLeft / 60);
        const seconds = timeLeft % 60;
        display.textContent = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
    }

    document.getElementById('startBtn').addEventListener('click', () => {
        if (timerId !== null) return; // Защита от двойного клика
        timerId = setInterval(() => {
            if (timeLeft > 0) {
                timeLeft--;
                updateDisplay();
            } else {
                clearInterval(timerId);
                timerId = null;
                alert("Время вышло! Не забудь сохранить результат.");
            }
        }, 1000);
    });

    document.getElementById('pauseBtn').addEventListener('click', () => {
        clearInterval(timerId);
        timerId = null;
    });

    document.getElementById('resetBtn').addEventListener('click', () => {
        clearInterval(timerId);
        timerId = null;
        timeLeft = 25 * 60;
        updateDisplay();
    });
</script>
{% endblock %}
